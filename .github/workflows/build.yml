name: Build and publish image

# Builds on GitHub's runners, not on the VPS. `next build` peaks around 1.7 GB
# and the server has ~2.6 GB free while also running another app — a build
# there is the one thing that could realistically OOM the box.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided automatically; no PAT needed for pushing.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `sha-<short>` is what makes a rollback a specific, nameable thing.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Next inlines NEXT_PUBLIC_* at build time, so the public origin has
          # to be supplied here rather than only at runtime.
          build-args: |
            NEXT_PUBLIC_APP_URL=https://auctioneer.sapper.top
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.tags }}"
